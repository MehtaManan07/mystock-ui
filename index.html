<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyStock - Inventory Management System" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    />
    <!-- Prevent browsers and proxies from caching the HTML entry point.
         All JS/CSS are content-hashed by Vite so they are safe to cache long-term,
         but index.html must always be re-fetched so clients pick up new asset hashes. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Kraft Culture</title>
    <script>
      // Apply the persisted theme before first paint so Tailwind's `.dark`
      // class is present immediately. Without this the app renders light and
      // then flips to dark once React mounts. Mirrors `stores/themeStore.ts`,
      // which zustand/persist stores as { state: { mode } }.
      (function () {
        try {
          var raw = localStorage.getItem('mystock_theme_mode');
          var mode = raw ? JSON.parse(raw).state.mode : 'light';
          if (mode === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* corrupt or unavailable storage - fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
